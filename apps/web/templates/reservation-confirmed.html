<div style="font-family:Arial,sans-serif;color:#0f172a;line-height:1.5">
  <h2 style="margin:0 0 8px;">HOSTEA - Reserva confirmada</h2>
  <p style="margin:0 0 14px;">Hola <strong>{{guest_name}}</strong>, tu reserva fue confirmada.</p>
  <img src="{{property_image_url}}" alt="Propiedad" style="width:100%;max-width:280px;border-radius:12px;display:block;margin:0 auto 16px;" />
  <p style="margin:0 0 8px;"><strong>{{property_name}}</strong></p>
  <p style="margin:0 0 12px;">{{property_address}}</p>
  <ul style="margin:0 0 14px;padding-left:18px;">
    <li>Check-in: {{check_in}}</li>
    <li>Check-out: {{check_out}}</li>
    <li>Huespedes: {{guests}}</li>
    <li>Total pagado: {{total_amount}}</li>
  </ul>
  <p style="margin:0 0 14px;">
    <a href="{{reservation_url}}" style="display:inline-block;padding:10px 14px;background:#0f172a;color:#fff;text-decoration:none;border-radius:999px;">
      Ver reserva
    </a>
  </p>
  <p style="font-size:12px;color:#64748b;margin:0;">Si no reconoces esta reserva, contacta a soporte.</p>
</div>
