<!--
  Replace ONLY the image src with your public Supabase Storage URL.
  Example:
  https://<project-ref>.supabase.co/storage/v1/object/public/hostea/brand/hostea-logo.jpeg
-->
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
  <tr>
    <td align="center" style="padding:24px 0 16px 0;">
      <img
        src="https://<project-ref>.supabase.co/storage/v1/object/public/hostea/brand/hostea-logo.jpeg"
        alt="Hostea"
        width="120"
        style="display:block;border:0;outline:none;text-decoration:none;height:auto;"
      />
    </td>
  </tr>
  <tr>
    <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;color:#0f172a;padding:0 24px 8px 24px;">
      Confirma tu cuenta en Hostea
    </td>
  </tr>
  <tr>
    <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#475569;padding:0 24px 20px 24px;">
      Haz clic en el botón para activar tu cuenta.
    </td>
  </tr>
  <tr>
    <td align="center" style="padding:0 24px 24px 24px;">
      <a
        href="{{ .ConfirmationURL }}"
        style="display:inline-block;background:#0f172a;color:#ffffff;text-decoration:none;padding:12px 18px;border-radius:999px;font-family:Arial,Helvetica,sans-serif;font-size:14px;"
      >
        Confirmar cuenta
      </a>
    </td>
  </tr>
</table>
